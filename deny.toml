# cargo-deny configuration — dependency advisory gate.
#
# Consumed by `cargo deny check advisories` in scripts/ci/pq-ci-guard.sh [1/6] (run in CI via the
# `Lints` job). A known RustSec vulnerability or a yanked crate FAILS CI. To accept a triaged but
# currently-unfixable advisory, add its ID to `ignore` below WITH a comment and a tracking link —
# never soften the gate globally.
#
# Context: this workspace pins post-quantum crypto (libcrux-ml-dsa = "=0.0.9"); the 2026 libcrux-ml-dsa
# advisories (RUSTSEC-2026-0077 / -0125 / -0126) are fixed at >= 0.0.8/0.0.9, so the current pin is
# clean. This gate exists to catch the next one before release.

[advisories]
# A yanked crate version in the lockfile is a hard failure.
yanked = "deny"
# Unmaintained advisories do NOT fail CI, per the documented gate above
# ("vulnerability + yanked only"). The flagged crates (ansi_term, atty, instant,
# mach, paste, proc-macro-error/2, rustls-pemfile, bincode, async-std) are
# non-actionable upstream/transitive deps. cargo-deny >=0.16 dropped the old
# "warn" level and defaults `unmaintained` to error on ALL crates, so disable the
# unmaintained category here to restore the intended posture; vulnerabilities and
# yanked crates remain hard failures (and are the real release gate).
unmaintained = "none"
# Triaged-but-unfixable advisory IDs go here, each with a justification + tracking issue.
ignore = [
  # "RUSTSEC-XXXX-NNNN", # why it is safe to ignore + link to the tracking issue
  # crypto-bigint 0.5.5 timing variability (fixed only in 0.7.6). It reaches us solely through
  # elliptic-curve 0.13 <- k256 0.13 <- alloy 0.8 / revm 14 (the EVM side); no 0.5.x fix exists and
  # moving to 0.7 needs k256/elliptic-curve 0.14, i.e. an alloy + revm major upgrade. The node only
  # runs public-input secp256k1 work there (ecrecover precompile, signature checks) — nothing
  # secret to leak; consensus signatures are ML-DSA and do not touch this crate. The one secret-key
  # use is local EVM signing in `misaka-cli` (evm-send), exposed only to an attacker who can time
  # the user's own machine. Remove when alloy/revm move to k256 >= 0.14 (crypto-bigint >= 0.7.6).
  # Recorded in docs/maintenance/ci-green-2026-10-26.md.
  "RUSTSEC-2026-0387",
]
