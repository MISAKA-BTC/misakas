[package]
name = "misaka-palw-tir-lower"
description = "RFC-0002 lowerer, Hugging Face side: config.json -> ArchSpec -> high-level ML graph (HL), safetensors weight mapping, and an f32 reference of the HL graph. Non-consensus tooling."
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "palw-tir-check"
path = "src/bin/palw-tir-check.rs"

[[bin]]
name = "palw-tir-generate"
path = "src/bin/palw-tir-generate.rs"

[[bin]]
name = "palw-tir-fidelity"
path = "src/bin/palw-tir-fidelity.rs"

[[bin]]
name = "palw-tir-convert"
path = "src/bin/palw-tir-convert.rs"

# Deliberately light: no kaspa-consensus-core, no misaka-palw-base0. This crate reads a Hugging
# Face checkpoint, lowers it to a PALW-TIR program plus integer params, and measures fidelity;
# nothing here is on a validation path. `misaka-palw-tir` is the IR itself (a leaf crate): the
# builder, the canonical encoding, the range analysis and the reference evaluator.
[dependencies]
misaka-palw-tir = { path = "../misaka-palw-tir" }
misaka-palw-tir-artifact = { path = "../misaka-palw-tir-artifact" }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_chacha.workspace = true
clap = { workspace = true, features = ["derive"] }
rayon.workspace = true
blake2b_simd.workspace = true
# palw-tir-fidelity --exec: the integer program on the typed backend (node software, no consensus;
# byte-identical to the reference evaluator — tests/three_way.rs).
misaka-palw-tir-exec = { path = "../misaka-palw-tir-exec" }

[dev-dependencies]
# Freeze criterion 4 on the lowered programs (tests/three_way.rs): the second implementation beside
# the reference evaluator and the typed backend. Tests only.
misaka-palw-tir-ref2 = { path = "../misaka-palw-tir-ref2" }

[features]
# `curl`-backed range fetching for remote checkpoints (`weights::CurlFetcher`). Off by default: the
# library never opens a network connection on its own, and no test does.
remote = []

[lints]
workspace = true
