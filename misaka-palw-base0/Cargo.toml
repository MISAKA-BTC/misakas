[package]
name = "misaka-palw-base0"
description = "PALW-BASE-0 (ADR-0040): the integer-only execution class — artifacts, engine, and the pinned rotary table"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
borsh.workspace = true
kaspa-txscript.workspace = true
kaspa-consensus-core.workspace = true
# `palw-rc-genesis` only: an operator generates a bond seed with `misaka validator keygen`, and
# something has to turn that seed into the PUBLIC values the genesis card wants. The derivation
# must be the same one the producer uses, so it is imported rather than re-implemented.
kaspa-pq-validator-core.workspace = true
kaspa-addresses.workspace = true
faster-hex.workspace = true
kaspa-hashes.workspace = true
blake2b_simd.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `class-weight-report` only. Family M's canonical job and its `pwu_per_inference` are facts of
# that crate's catalog, and a report that re-declared them here would be a second place they could
# be wrong. A dev-dependency keeps the edge out of the production graph — nothing a node links
# gains a path from the integer family to the Metal one.
misaka-palw-metal.workspace = true
