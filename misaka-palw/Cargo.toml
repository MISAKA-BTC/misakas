[package]
name = "misaka-palw"
description = "MISAKA Verified LLM Token-Weighted BFT compute runtime bridge: drives the pinned PALW llama.cpp worker as a subprocess and maps its MatchProjectionV1 onto the consensus ComputeReceipt, so the consensus byte-match IS the PALW k=2 replica match"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaspa-consensus-core.workspace = true
kaspa-hashes.workspace = true

blake2b_simd.workspace = true
# v2 agent client: the framed Borsh UDS protocol (misaka-palw-agent-borsh/v1).
borsh.workspace = true
faster-hex.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# ADR-0079 host_security: geteuid for the per-user scratch directory name, and sysconf(_SC_PAGESIZE)
# for the /proc statm fallback. Unix-gated so the Windows build of `kaspad` (a non-optional
# dependent) does not grow a dependency it has no use for.
libc = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[features]
# MISAKA: the devnet-only deterministic compute runtime that matches the consensus fixture
# profile. Never in a release build.
devnet-vlt-fixture = ["kaspa-consensus-core/devnet-vlt-fixture"]
