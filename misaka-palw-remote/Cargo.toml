[package]
name = "misaka-palw-remote"
description = "RFC-0009: the client half of a PALW miner that runs no kaspad — a multi-node chain view with a pinned checkpoint, idempotent relay of a locally signed carrier or block, the attempt-template digest, claim tracking that survives a reorg, and (stage B) the evidence manifest with any-provider fetch. Pure: no RPC, no runtime; the binaries adapt their own nodes to its traits."
