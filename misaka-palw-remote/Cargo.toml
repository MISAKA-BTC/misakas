[package]
name = "misaka-palw-remote"
description = "RFC-0009: the client half of a PALW miner that runs no kaspad — a multi-node chain view with a pinned checkpoint, idempotent relay of a locally signed carrier or block, the attempt-template digest, claim tracking that survives a reorg, and (stage B) the evidence manifest with any-provider fetch. Pure: no RPC, no runtime; the binaries adapt their own nodes to its traits."
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
kaspa-hashes.workspace = true
kaspa-txscript.workspace = true
# Read-only: the shared onboarding lifecycle codes the registration status is shown in (Registered is not Active).
misaka-palw-challenge.workspace = true
# DA16 (public material): the kernel's claim rows (a position is verified by its own classification), the IR program, and the
# PALWTIR1 container the root-fetch hook writes.
misaka-palw-kernel.workspace = true
misaka-palw-tir.workspace = true
misaka-palw-tir-artifact = { path = "../misaka-palw-tir-artifact" }
blake2b_simd.workspace = true
borsh.workspace = true
faster-hex.workspace = true
libcrux-ml-dsa.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# The `palw-remote-miner` binary (feature `rpc`): a wRPC client, the miner's key and the PoW state for the network draw. The library above
# stays free of all of it.
kaspa-wrpc-client = { workspace = true, optional = true }
kaspa-rpc-core = { workspace = true, optional = true }
kaspa-pow = { workspace = true, optional = true }
kaspa-pq-validator-core = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"], optional = true }

[features]
rpc = ["dep:kaspa-wrpc-client", "dep:kaspa-rpc-core", "dep:kaspa-pow", "dep:kaspa-pq-validator-core", "dep:tokio"]

[[bin]]
name = "palw-remote-miner"
path = "src/bin/palw-remote-miner.rs"
required-features = ["rpc"]

[dev-dependencies]
# DA16: the sketch's fixture weights (an artifact, its inventory, its kernel commitments).
misaka-palw-tir-sketch = { path = "../misaka-palw-tir-sketch" }
# Carrier fixtures for the relay tests: a free-prompt commitment built through the shipped builder.
kaspa-pq-validator-core.workspace = true

[lints]
workspace = true
