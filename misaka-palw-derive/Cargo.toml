[package]
name = "misaka-palw-derive"
description = "ADR-0078: what was made from it is committed, the thing itself never rides — registered grammars, content-named deterministic transformers, and the derivation glue that binds a derived artifact to a free-prompt claim"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaspa-consensus-core.workspace = true
kaspa-hashes.workspace = true
# The simulation kind's step-hash chain and every keyed digest a kind needs.
blake2b_simd.workspace = true
faster-hex.workspace = true
# The `code` / `contract` kinds' first named toolchain is the tree's own EVM (ADR-0078 Decision 11):
# `kaspa-evm` pins the spec id the lane executes under, `revm` is the machine.
kaspa-evm.workspace = true
revm = { version = "14", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
