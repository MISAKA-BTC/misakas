[package]
name = "misaka-palw-bridge"
description = "PALW desktop-coordinator bridge (ADR-0039 lane, desktop product doc §15): the node-side server half of the palw-gateway coordinator protocol v1 (jobs / verdicts / assignments / declines / replica-results). Replica matching runs the REAL misaka-palw k=2 rule (ReplicaMatchKey::exact_match via run_replica_k2) over keys built from the qi35-serve execution roots; state is an append-only hash-chained event journal; self-replica is refused at the protocol layer. Off-chain: no beacons, bonds, DA retention or rewards — those stay consensus-side."
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "misaka-palw-bridge"
path = "src/main.rs"

[[bin]]
name = "palw-bridge-verify"
path = "src/bin/palw-bridge-verify.rs"

[lib]
name = "misaka_palw_bridge"
path = "src/lib.rs"

[dependencies]
misaka-palw.workspace = true
kaspa-consensus-core.workspace = true
kaspa-hashes.workspace = true
kaspa-rpc-core.workspace = true
kaspa-txscript.workspace = true
kaspa-wrpc-client.workspace = true
faster-hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "macros"] }
borsh.workspace = true
kaspa-pq-validator-core.workspace = true
blake2b_simd.workspace = true

[lints]
workspace = true
