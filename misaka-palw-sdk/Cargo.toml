[package]
name = "misaka-palw-sdk"
description = "The one interface every PALW model class passes through: lineage contract, class ledger, artifact loading, registration candidates, admission preflight, and backend resolution"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaspa-consensus-core.workspace = true
kaspa-hashes.workspace = true
misaka-palw-base0.workspace = true
# ADR-0100 `palw-class measure` / `verify`: the Measured Model Artifact is JSON, signed by the
# adder's bond key and verified by anyone holding the public key.
kaspa-pq-validator-core.workspace = true
kaspa-txscript.workspace = true
serde_json.workspace = true

[[bin]]
name = "palw-class"
path = "src/bin/palw-class.rs"
