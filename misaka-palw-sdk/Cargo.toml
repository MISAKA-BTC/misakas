[package]
name = "misaka-palw-sdk"
description = "The one interface every PALW model class passes through: lineage contract, class ledger, artifact loading, registration candidates, admission preflight, and backend resolution"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The fused unit-row kernels on the GPU (macOS), behind the node's `--palw-tir-metal`.
metal = ["misaka-palw-tir-exec/metal"]

[dependencies]
kaspa-consensus-core.workspace = true
kaspa-hashes.workspace = true
misaka-palw-base0.workspace = true
# RFC-0002 Phase F: IR artifacts (the PALWTIR1 container) and their manifest.
misaka-palw-tir.workspace = true
# ADR-0172: the K2-TIR-v1 reference kernel's static route of a lowered program (reported by the preflight and the census).
misaka-palw-kernel.workspace = true
# RFC-0003: a generative class's output header (declaring a pipeline class).
misaka-palw-gen.workspace = true
misaka-palw-tir-artifact = { path = "../misaka-palw-tir-artifact" }
# RFC-0002 Phase F (F9): the typed IR executor as a node runs a class — the mapped artifact, the
# step leg, the evidence builders — behind `TirLineageV1`.
misaka-palw-tir-exec = { path = "../misaka-palw-tir-exec", features = ["node"] }
# `check-architecture`'s IR mode: a Hugging Face config lowered to a PALW-TIR program (the lowerer
# is non-consensus tooling; the verdict comes from consensus functions).
misaka-palw-tir-lower = { path = "../misaka-palw-tir-lower", features = ["remote"] }
# A PALWTIR1 container's declared layout is `borsh(PalwTirLayoutV1)`; the manifest decodes it.
borsh.workspace = true
# An IR class's certification drill runs at an anchor keyed off its class id.
blake2b_simd.workspace = true
# `palw-tir-equiv` (D-F1 offline): the IR side of a 1.5B class runs on the typed backend (the
# `misaka-palw-tir-exec` dependency above), the random prompts are seeded.
rand.workspace = true
rand_chacha.workspace = true
# ADR-0100 `palw-class measure` / `verify`: the Measured Model Artifact is JSON, signed by the
# adder's bond key and verified by anyone holding the public key.
kaspa-pq-validator-core.workspace = true
kaspa-txscript.workspace = true
serde_json.workspace = true
# Runtime packs (`runtime_pack`): the source files' SHA-256 (the hub's git-lfs object ids) and the
# independent second implementation of the IR, one of the executors a pack's conformance runs.
sha2.workspace = true
misaka-palw-tir-ref2 = { path = "../misaka-palw-tir-ref2" }
# RFC-0007 Part VI / RFC-0013 §9: the ONE post-commit challenge contract (policy, work beacon, seed, samplers, conformance
# records). A pack's beacon conformance consumes it; this crate derives no beacon, seed or sampler of its own.
misaka-palw-challenge.workspace = true
# Peak RSS of a conformance run (getrusage), reported in the run record, never in the evidence.
libc.workspace = true
# Portable HF-fit arithmetic, outside consensus; policies pin libm-v1.
libm = "0.2.8"
serde = { workspace = true }
# The Hugging Face census (`census`) reads its header store gzip-compressed.
flate2.workspace = true

[build-dependencies]
# build.rs: the source digests of the implementations a beacon-conformance commitment names.
blake2b_simd.workspace = true

[[bin]]
name = "palw-class"
path = "src/bin/palw-class.rs"

[[bin]]
name = "palw-tir-equiv"
path = "src/bin/palw-tir-equiv.rs"

[dev-dependencies]
# `census::onboarding`'s tokens are the lifecycle's `OnboardingFailureV1::code()` (a test compares them).
misaka-palw-challenge.workspace = true
misaka-palw-tir-sketch = { path = "../misaka-palw-tir-sketch" }
# The IR registration test signs and verifies under a bond's ML-DSA-87 key, as the node does.
libcrux-ml-dsa.workspace = true
# The streamed-root test converts on pools of one and of seven threads.
rayon.workspace = true
