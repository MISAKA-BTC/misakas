[package]
name = "kaspad"
description = "Kaspa full node daemon"
keywords = ["kaspa", "blockdag"]
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kaspad_lib"
crate-type = ["cdylib", "lib"]

[dependencies]
kaspa-alloc.workspace = true # This changes the global allocator for all of the next dependencies so should be kept first

kaspa-addresses.workspace = true
kaspa-addressmanager.workspace = true
kaspa-consensus-core.workspace = true
kaspa-pow.workspace = true
kaspa-consensus-notify.workspace = true
misaka-endpoints.workspace = true
kaspa-consensus.workspace = true
kaspa-consensusmanager.workspace = true
kaspa-core.workspace = true
kaspa-database.workspace = true
# Ethereum JSON-RPC adapter — only linked under the `evm` feature (keeps the
# default node secp-free; the adapter itself pulls no revm). kaspa-evm provides
# the read-only eth_call/estimateGas simulation behind the adapter.
kaspa-eth-rpc = { workspace = true, optional = true }
kaspa-evm = { workspace = true, optional = true }
kaspa-grpc-server.workspace = true
kaspa-hashes.workspace = true
kaspa-index-processor.workspace = true
kaspa-mining.workspace = true
kaspa-notify.workspace = true
kaspa-p2p-flows.workspace = true
kaspa-p2p-lib.workspace = true
kaspa-p2p-mining.workspace = true
kaspa-perf-monitor.workspace = true
kaspa-pq-validator-core.workspace = true
misaka-palw-base0.workspace = true
kaspa-rpc-core.workspace = true
kaspa-rpc-service.workspace = true
kaspa-txscript.workspace = true
kaspa-utils.workspace = true
kaspa-utils-tower.workspace = true
kaspa-utxoindex.workspace = true
kaspa-wrpc-server.workspace = true
misaka-palw.workspace = true
misaka-palw-pow-driver.workspace = true

async-channel.workspace = true
async-trait.workspace = true
blake2b_simd.workspace = true
borsh.workspace = true
cfg-if.workspace = true
clap = { workspace = true, features = ["env"]}
dhat = { workspace = true, optional = true }
dirs.workspace = true
faster-hex.workspace = true
futures-util.workspace = true
itertools.workspace = true
libcrux-ml-dsa.workspace = true
log.workspace = true
num_cpus.workspace = true
rand.workspace = true
rayon.workspace = true
rocksdb.workspace = true
serde.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
workflow-log.workspace = true
serde_json.workspace = true

toml = "0.8.10"
serde_with = "3.7.0"

[features]
# The EVM lane is part of the node, not a bolt-on (user decision 2026-08-21). testnet-11 and
# testnet-12 activate the lane at DAA 0, so a binary built without it refuses to start there
# (`EvmLaneRequiresEvmBuild`) — which turned "forgot the flag" into a fleet-wide operational trap.
# A plain `cargo build -p kaspad` now yields the binary those networks require; mainnet keeps the
# lane inert by params (`evm_activation_daa_score: u64::MAX`), not by the build. The cost is that
# the DEFAULT artifact now links secp256k1 via revm's ecrecover — the consensus rules stay PQ-only,
# but a secp-free artifact needs an explicit `--no-default-features` build.
default = ["evm"]
heap = ["dhat", "kaspa-alloc/heap"]
devnet-prealloc = ["kaspa-consensus/devnet-prealloc"]
# MISAKA: devnet-only deterministic VLT fixture (consensus profile + matching runtime).
devnet-vlt-fixture = ["kaspa-consensus/devnet-vlt-fixture", "misaka-palw/devnet-vlt-fixture"]
semaphore-trace = ["kaspa-utils/semaphore-trace"]
# kaspa-pq Selected-Parent EVM Lane (ADR-0020). Default since 2026-08-21 (see `default` above);
# the revm executor runs IN this process — there is no separate EVM daemon.
evm = ["kaspa-consensus/evm", "kaspa-mining/evm", "kaspa-p2p-flows/evm", "dep:kaspa-eth-rpc", "dep:kaspa-evm"]

[lints]
workspace = true
