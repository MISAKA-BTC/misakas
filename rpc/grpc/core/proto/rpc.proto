// RPC-related types. Request messages, response messages, and dependant types.
//
// Clients are expected to build RequestMessages and wrap them in KaspadMessage. (see messages.proto)
//
// Having received a RequestMessage, (wrapped in a KaspadMessage) the RPC server will respond with a
// ResponseMessage (likewise wrapped in a KaspadMessage) respective to the original RequestMessage.
//
// kaspa-pq Phase 7 (PR-7.2): package is `protowire.kaspapq` so a mainline Kaspa
// client cannot accidentally bind to a kaspa-pq node. See
// docs/adr/0006-rpc-wasm-sdk-types.md §2.
//
syntax = "proto3";
package protowire.kaspapq;

// kaspa-pq Phase 7: address version enum.
//
// Mirrors `kaspa_addresses::Version` (in crypto/addresses/src/lib.rs):
//   PUB_KEY                  = 0 — legacy Schnorr (parser-only in kaspa-pq).
//   PUB_KEY_ECDSA            = 1 — legacy ECDSA (parser-only in kaspa-pq).
//   PUB_KEY_HASH_ML_DSA_65   = 2 — kaspa-pq standard send (P2PKH over ML-DSA-65).
//   SCRIPT_HASH              = 8 — P2SH (script hash).
//
// Discriminants match the on-chain version byte (see
// docs/adr/0002-mldsa65-p2pkh.md §"Address").
enum AddressVersion {
  PUB_KEY                = 0;
  PUB_KEY_ECDSA          = 1;
  PUB_KEY_HASH_ML_DSA_65 = 2;
  SCRIPT_HASH            = 8;
}

// RPCError represents a generic non-internal error.
//
// Receivers of any ResponseMessage are expected to check whether its error field is not null.
message RPCError {
  string message = 1;
}

message RpcBlock {
  RpcBlockHeader header = 1;
  repeated RpcTransaction transactions = 2;
  RpcBlockVerboseData verboseData = 3;
  // kaspa-pq EVM Lane v0.4 (ADR-0020 §3.1): the block's own EvmExecutionPayload
  // as canonical borsh bytes (what evmPayloadHash commits to). Empty = empty
  // payload. MUST round-trip through get_block_template / submit_block.
  bytes evmPayload = 4;
}

message RpcBlockHeader {
  uint32 version = 1;
  repeated RpcBlockLevelParents parents = 12;
  string hashMerkleRoot = 3;
  string acceptedIdMerkleRoot = 4;
  string utxoCommitment = 5;
  int64 timestamp = 6;
  uint32 bits = 7;
  uint64 nonce = 8;
  uint64 daaScore = 9;
  string blueWork = 10;
  uint64 blueScore = 13;
  string pruningPoint = 14;
  string hash = 15;
  uint32 powAlgoId = 16; // kaspa-pq Phase 2 (ADR-0007): Layer-1 algo id (1=kHeavyHash, 2=Argon2id)
  // kaspa-pq EVM Lane v0.4 (ADR-0020 §4): the two EVM commitments (128-char hex).
  // Part of the v2+ header-hash preimage — MUST survive the mining round-trip
  // (the powAlgoId precedent). Empty/zero on v0/v1 headers.
  string evmPayloadHash = 17;
  string evmCommitmentRoot = 18;
  // kaspa-pq ADR-0022: the DNS/PoS-v2 overlay-state commitment (128-char hex).
  // Part of the header-hash preimage on every version — MUST survive the mining
  // round-trip (the powAlgoId / EVM-commitment precedent).
  string overlayCommitmentRoot = 19;
  // MISAKA ADR-0038: the post-PoW PALW block commitment (PBC1 bytes, hex). Set
  // by the miner AFTER the winning nonce, part of the block-identity preimage
  // on PALW algo ids — MUST survive the submit_block round-trip or a mined
  // PALW block loses its commitment. Empty on non-PALW headers.
  string palwCommitment = 20;
  // ADR-0042 Unit C step 5: the PALW V2 chain-state root (128-char hex), PRE-PoW and part of the
  // header-hash preimage on V2-lineage algo ids — MUST survive the mining round-trip or a mined
  // V2 block loses the root its own chain committed to. Zero on non-V2 headers.
  string palwStateRoot = 21;
}

message RpcBlockLevelParents {
  repeated string parentHashes = 1;
}

message RpcBlockLevelRun {
  repeated string parentHashes = 1;
  // must be <= 255 (u8)
  uint32 cumulativeLevel = 2;
}

message RpcBlockVerboseData {
  string hash = 1;
  double difficulty = 11;
  string selectedParentHash = 13;
  repeated string transactionIds = 14;
  bool isHeaderOnly = 15;
  uint64 blueScore = 16;
  repeated string childrenHashes = 17;
  repeated string mergeSetBluesHashes = 18;
  repeated string mergeSetRedsHashes = 19;
  bool isChainBlock = 20;
}

message RpcTransaction {
  uint32 version = 1;
  repeated RpcTransactionInput inputs = 2;
  repeated RpcTransactionOutput outputs = 3;
  uint64 lockTime = 4;
  string subnetworkId = 5;
  uint64 gas = 6;
  string payload = 8;
  RpcTransactionVerboseData verboseData = 9;
  uint64 mass = 10;
}

message RpcTransactionVerboseData {
  string transactionId = 1;
  string hash = 2;
  uint64 computeMass = 4;
  string blockHash = 12;
  uint64 blockTime = 14;
}

message RpcTransactionInput {
  RpcOutpoint previousOutpoint = 1;
  string signatureScript = 2;
  uint64 sequence = 3;
  uint32 sigOpCount = 5;
  RpcTransactionInputVerboseData verboseData = 4;
}

message RpcTransactionInputVerboseData {
  RpcUtxoEntry utxoEntry = 1; // this field is new, if this is null, the utxo cannot be found, or is coinbase.
}

message RpcUtxoEntry {
  uint64 amount = 1;
  RpcScriptPublicKey scriptPublicKey = 2;
  uint64 blockDaaScore = 3;
  bool isCoinbase = 4;
  RpcUtxoEntryVerboseData verboseData = 5;
}

message RpcUtxoEntryVerboseData {
  string scriptPublicKeyType = 5;
  string scriptPublicKeyAddress = 6;
}

message RpcScriptPublicKey {
  uint32 version = 1;
  string scriptPublicKey = 2;
}

message RpcTransactionOutput {
  uint64 amount = 1;
  RpcScriptPublicKey scriptPublicKey = 2;
  RpcTransactionOutputVerboseData verboseData = 3;
}

message RpcOutpoint {
  string transactionId = 1;
  uint32 index = 2;
}

message RpcTransactionOutputVerboseData {
  string scriptPublicKeyType = 5;
  string scriptPublicKeyAddress = 6;
}

enum RpcNotifyCommand {
  NOTIFY_START = 0;
  NOTIFY_STOP = 1;
}

// GetCurrentNetworkRequestMessage requests the network kaspad is currently running against.
//
// Possible networks are: Mainnet, Testnet, Simnet, Devnet
message GetCurrentNetworkRequestMessage {}

message GetCurrentNetworkResponseMessage {
  string currentNetwork = 1;
  RPCError error = 1000;
}

// SubmitBlockRequestMessage requests to submit a block into the DAG.
// Blocks are generally expected to have been generated using the getBlockTemplate call.
//
// See: GetBlockTemplateRequestMessage
message SubmitBlockRequestMessage {
  RpcBlock block = 2;
  bool allowNonDAABlocks = 3;
}

message SubmitBlockResponseMessage {
  enum RejectReason {
    NONE = 0;
    BLOCK_INVALID = 1;
    IS_IN_IBD = 2;
  }
  RejectReason rejectReason = 1;
  RPCError error = 1000;
}

// GetBlockTemplateRequestMessage requests a current block template.
// Callers are expected to solve the block template and submit it using the submitBlock call
//
// See: SubmitBlockRequestMessage
message GetBlockTemplateRequestMessage {
  // Which kaspa address should the coinbase block reward transaction pay into
  string payAddress = 1;
  string extraData = 2;
}

message GetBlockTemplateResponseMessage {
  RpcBlock block = 3;

  // Whether kaspad thinks that it's synced.
  // Callers are discouraged (but not forbidden) from solving blocks when kaspad is not synced.
  // That is because when kaspad isn't in sync with the rest of the network there's a high
  // chance the block will never be accepted, thus the solving effort would have been wasted.
  bool isSynced = 2;

  RPCError error = 1000;
}

// NotifyBlockAddedRequestMessage registers this connection for blockAdded notifications.
//
// See: BlockAddedNotificationMessage
message NotifyBlockAddedRequestMessage {
  RpcNotifyCommand command = 101;
}

message NotifyBlockAddedResponseMessage {
  RPCError error = 1000;
}

// BlockAddedNotificationMessage is sent whenever a blocks has been added (NOT accepted)
// into the DAG.
//
// See: NotifyBlockAddedRequestMessage
message BlockAddedNotificationMessage {
  RpcBlock block = 3;
}

// GetPeerAddressesRequestMessage requests the list of known kaspad addresses in the
// current network. (mainnet, testnet, etc.)
message GetPeerAddressesRequestMessage {}

message GetPeerAddressesResponseMessage {
  repeated GetPeerAddressesKnownAddressMessage addresses = 1;
  repeated GetPeerAddressesKnownAddressMessage bannedAddresses = 2;
  RPCError error = 1000;
}

message GetPeerAddressesKnownAddressMessage {
  string Addr = 1;
}

// GetSinkRequestMessage requests the hash of the current virtual's
// selected parent.
message GetSinkRequestMessage {}

message GetSinkResponseMessage {
  string sink = 1;
  RPCError error = 1000;
}

// GetMempoolEntryRequestMessage requests information about a specific transaction
// in the mempool.
message GetMempoolEntryRequestMessage {
  // The transaction's TransactionID.
  string txId = 1;
  bool includeOrphanPool = 2;
  bool filterTransactionPool = 3;
}

message GetMempoolEntryResponseMessage {
  RpcMempoolEntry entry = 1;

  RPCError error = 1000;
}

// GetMempoolEntriesRequestMessage requests information about all the transactions
// currently in the mempool.
message GetMempoolEntriesRequestMessage {
  bool includeOrphanPool = 1;
  bool filterTransactionPool = 2;
}

message GetMempoolEntriesResponseMessage {
  repeated RpcMempoolEntry entries = 1;

  RPCError error = 1000;
}

message RpcMempoolEntry {
  uint64 fee = 1;
  RpcTransaction transaction = 3;
  bool isOrphan = 4;
}

// GetConnectedPeerInfoRequestMessage requests information about all the p2p peers
// currently connected to this kaspad.
message GetConnectedPeerInfoRequestMessage {}

message GetConnectedPeerInfoResponseMessage {
  repeated GetConnectedPeerInfoMessage infos = 1;
  RPCError error = 1000;
}

message GetConnectedPeerInfoMessage {
  string id = 1;
  string address = 2;

  // How long did the last ping/pong exchange take
  int64 lastPingDuration = 3;

  // Whether this kaspad initiated the connection
  bool isOutbound = 6;
  int64 timeOffset = 7;
  string userAgent = 8;

  // The protocol version that this peer claims to support
  uint32 advertisedProtocolVersion = 9;

  // The timestamp of when this peer connected to this kaspad
  int64 timeConnected = 10;

  // Whether this peer is the IBD peer (if IBD is running)
  bool isIbdPeer = 11;
}

// AddPeerRequestMessage adds a peer to kaspad's outgoing connection list.
// This will, in most cases, result in kaspad connecting to said peer.
message AddPeerRequestMessage {
  string address = 1;

  // Whether to keep attempting to connect to this peer after disconnection
  bool isPermanent = 2;
}

message AddPeerResponseMessage {
  RPCError error = 1000;
}

// SubmitTransactionRequestMessage submits a transaction to the mempool
message SubmitTransactionRequestMessage {
  RpcTransaction transaction = 1;
  bool allowOrphan = 2;
}

message SubmitTransactionResponseMessage {
  // The transaction ID of the submitted transaction
  string transactionId = 1;

  RPCError error = 1000;
}

// SubmitTransactionReplacementRequestMessage submits a transaction to the mempool, applying a mandatory Replace by Fee policy
message SubmitTransactionReplacementRequestMessage {
  RpcTransaction transaction = 1;
}

message SubmitTransactionReplacementResponseMessage {
  // The transaction ID of the submitted transaction
  string transactionId = 1;

  // The previous transaction replaced in the mempool by the newly submitted one
  RpcTransaction replacedTransaction = 2;

  RPCError error = 1000;
}

// NotifyVirtualChainChangedRequestMessage registers this connection for virtualChainChanged notifications.
//
// See: VirtualChainChangedNotificationMessage
message NotifyVirtualChainChangedRequestMessage {
  bool includeAcceptedTransactionIds = 1;
  RpcNotifyCommand command = 101;
}

message NotifyVirtualChainChangedResponseMessage {
  RPCError error = 1000;
}

// VirtualChainChangedNotificationMessage is sent whenever the DAG's selected parent
// chain had changed.
//
// See: NotifyVirtualChainChangedRequestMessage
message VirtualChainChangedNotificationMessage {
  // The chain blocks that were removed, in high-to-low order
  repeated string removedChainBlockHashes = 1;

  // The chain blocks that were added, in low-to-high order
  repeated string addedChainBlockHashes = 3;

  // Will be filled only if `includeAcceptedTransactionIds = true` in the notify request.
  repeated RpcAcceptedTransactionIds acceptedTransactionIds = 2;
}

// GetBlockRequestMessage requests information about a specific block
message GetBlockRequestMessage {
  // The hash of the requested block
  string hash = 1;

  // Whether to include transaction data in the response
  bool includeTransactions = 3;
}

message GetBlockResponseMessage {
  RpcBlock block = 3;
  RPCError error = 1000;
}

// GetSubnetworkRequestMessage requests information about a specific subnetwork
//
// Currently unimplemented
message GetSubnetworkRequestMessage {
  string subnetworkId = 1;
}

message GetSubnetworkResponseMessage {
  uint64 gasLimit = 1;
  RPCError error = 1000;
}

/// GetVirtualChainFromBlockRequestMessage requests the virtual selected
/// parent chain from some startHash to this kaspad's current virtual
/// Note:
///     this call batches the response to:
///         a. the network's `mergeset size limit * 10` amount of added chain blocks, if `includeAcceptedTransactionIds = false`
///         b. or `mergeset size limit * 10` amount of merged blocks, if `includeAcceptedTransactionIds = true`
///         c. it does not batch the removed chain blocks, only the added ones.
message GetVirtualChainFromBlockRequestMessage {
  string startHash = 1;
  bool includeAcceptedTransactionIds = 2;
  optional uint64 minConfirmationCount = 3;
}

message RpcAcceptedTransactionIds {
  string acceptingBlockHash = 1;
  repeated string acceptedTransactionIds = 2;
}

message GetVirtualChainFromBlockResponseMessage {
  // The chain blocks that were removed, in high-to-low order
  repeated string removedChainBlockHashes = 1;

  // The chain blocks that were added, in low-to-high order
  repeated string addedChainBlockHashes = 3;

  // The transactions accepted by each block in addedChainBlockHashes.
  // Will be filled only if `includeAcceptedTransactionIds = true` in the request.
  repeated RpcAcceptedTransactionIds acceptedTransactionIds = 2;

  RPCError error = 1000;
}

// GetBlocksRequestMessage requests blocks between a certain block lowHash up to this
// kaspad's current virtual.
message GetBlocksRequestMessage {
  string lowHash = 1;
  bool includeBlocks = 2;
  bool includeTransactions = 3;
}

message GetBlocksResponseMessage {
  repeated string blockHashes = 4;
  repeated RpcBlock blocks = 3;
  RPCError error = 1000;
}

// GetBlockCountRequestMessage requests the current number of blocks in this kaspad.
// Note that this number may decrease as pruning occurs.
message GetBlockCountRequestMessage {}

message GetBlockCountResponseMessage {
  uint64 blockCount = 1;
  uint64 headerCount = 2;
  RPCError error = 1000;
}

// GetBlockDagInfoRequestMessage requests general information about the current state
// of this kaspad's DAG.
message GetBlockDagInfoRequestMessage {}

message GetBlockDagInfoResponseMessage {
  string networkName = 1;
  uint64 blockCount = 2;
  uint64 headerCount = 3;
  repeated string tipHashes = 4;
  double difficulty = 5;
  int64 pastMedianTime = 6;
  repeated string virtualParentHashes = 7;
  string pruningPointHash = 8;
  uint64 virtualDaaScore = 9;
  string sink = 10;
  RPCError error = 1000;
}

message ResolveFinalityConflictRequestMessage {
  string finalityBlockHash = 1;
}

message ResolveFinalityConflictResponseMessage {
  RPCError error = 1000;
}

message NotifyFinalityConflictRequestMessage {
  RpcNotifyCommand command = 101;
}

message NotifyFinalityConflictResponseMessage {
  RPCError error = 1000;
}

message FinalityConflictNotificationMessage {
  string violatingBlockHash = 1;
}

message FinalityConflictResolvedNotificationMessage {
  string finalityBlockHash = 1;
}

// ShutdownRequestMessage shuts down this kaspad.
message ShutdownRequestMessage {}

message ShutdownResponseMessage {
  RPCError error = 1000;
}

// GetHeadersRequestMessage requests headers between the given startHash and the
// current virtual, up to the given limit.
message GetHeadersRequestMessage {
  string startHash = 1;
  uint64 limit = 2;
  bool isAscending = 3;
}

message GetHeadersResponseMessage {
  repeated string headers = 1;
  RPCError error = 1000;
}

// NotifyUtxosChangedRequestMessage registers this connection for utxoChanged notifications
// for the given addresses.
//
// This call is only available when this kaspad was started with `--utxoindex`
//
// See: UtxosChangedNotificationMessage
message NotifyUtxosChangedRequestMessage {
  // UTXOs addresses to start/stop getting notified about
  // Leave empty to start/stop all updates
  repeated string addresses = 1;
  RpcNotifyCommand command = 101;
}

message NotifyUtxosChangedResponseMessage {
  RPCError error = 1000;
}

// UtxosChangedNotificationMessage is sent whenever the UTXO index had been updated.
//
// See: NotifyUtxosChangedRequestMessage
message UtxosChangedNotificationMessage {
  repeated RpcUtxosByAddressesEntry added = 1;
  repeated RpcUtxosByAddressesEntry removed = 2;
}

message RpcUtxosByAddressesEntry {
  string address = 1;
  RpcOutpoint outpoint = 2;
  RpcUtxoEntry utxoEntry = 3;
}

// StopNotifyingUtxosChangedRequestMessage unregisters this connection for utxoChanged notifications
// for the given addresses.
//
// This call is only available when this kaspad was started with `--utxoindex`
//
// See: UtxosChangedNotificationMessage
//
// This message only exists for backward compatibility reason with kaspad and is deprecated.
// Use instead UtxosChangedNotificationMessage with command = NOTIFY_STOP.
message StopNotifyingUtxosChangedRequestMessage {
  repeated string addresses = 1;
}

message StopNotifyingUtxosChangedResponseMessage {
  RPCError error = 1000;
}

// GetUtxosByAddressesRequestMessage requests all current UTXOs for the given kaspad addresses
//
// This call is only available when this kaspad was started with `--utxoindex`
message GetUtxosByAddressesRequestMessage {
  repeated string addresses = 1;
}

message GetUtxosByAddressesResponseMessage {
  repeated RpcUtxosByAddressesEntry entries = 1;

  RPCError error = 1000;
}

// GetUtxosByAddressPageRequestMessage requests a bounded, cursor-paginated page of UTXOs for a
// single address. Use it instead of GetUtxosByAddressesRequestMessage for addresses with very large
// UTXO sets. cursor is the opaque token from the previous page's nextCursor (empty = start); limit
// 0 selects the server default and the server caps the effective value.
//
// This call is only available when this kaspad was started with `--utxoindex`
message GetUtxosByAddressPageRequestMessage {
  string address = 1;
  string cursor = 2;
  uint64 limit = 3;
}

message GetUtxosByAddressPageResponseMessage {
  repeated RpcUtxosByAddressesEntry entries = 1;
  // Opaque resume token for the next page; empty = no further pages.
  string nextCursor = 2;

  RPCError error = 1000;
}

// GetBalanceByAddressRequest returns the total balance in unspent transactions towards a given address
//
// This call is only available when this kaspad was started with `--utxoindex`
message GetBalanceByAddressRequestMessage {
  string address = 1;
}

message GetBalanceByAddressResponseMessage {
  uint64 balance = 1;

  RPCError error = 1000;
}

message GetBalancesByAddressesRequestMessage {
  repeated string addresses = 1;
}

message RpcBalancesByAddressesEntry {
  string address = 1;
  uint64 balance = 2;

  RPCError error = 1000;
}

message GetBalancesByAddressesResponseMessage {
  repeated RpcBalancesByAddressesEntry entries = 1;

  RPCError error = 1000;
}

// GetSinkBlueScoreRequestMessage requests the blue score of the current selected parent
// of the virtual block.
message GetSinkBlueScoreRequestMessage {}

message GetSinkBlueScoreResponseMessage {
  uint64 blueScore = 1;

  RPCError error = 1000;
}

// kaspa-pq Phase 10 (ADR-0009): the current DNS finality confirmation view.
message GetDnsConfirmationRequestMessage {
  // kaspa-pq: optional 128-hex block hash. When set, the response's block* fields report that
  // block's DNS finality. Empty = the node-wide current view only.
  string blockHash = 1;
}

message GetDnsConfirmationResponseMessage {
  bool available = 1;
  string blockHash = 2;
  string workDepth = 3;
  string requiredWorkDepth = 4;
  string stakeDepth = 5;
  string requiredStakeDepth = 6;
  bool powConfirmed = 7;
  bool dnsConfirmed = 8;
  uint32 rolloutStage = 9;
  uint64 expectedDnsConfirmationSeconds = 10;
  string workReorgRiskUpperBound = 11;
  string stakeReorgRiskUpperBound = 12;
  string dnsReorgRiskConservativeBound = 13;
  string note = 14;
  // kaspa-pq Phase 13 (ADR-0018 §C): DnsHealth discriminant (0=Disabled, 1=Active,
  // 2=DegradedStakeQualityLow, 3=DegradedCertificateCensored). Read-only liveness signal.
  uint32 health = 15;
  // kaspa-pq audit M-01: the LAST DNS-confirmed canonical lagged anchor (the stable finality point)
  // and its DAA score — distinct from blockHash (the pov-dependent selected-chain sink). Clients
  // MUST treat this as DNS-final, not blockHash. Empty / 0 until an anchor is first confirmed.
  string lastDnsConfirmedAnchor = 16;
  uint64 lastDnsConfirmedAnchorDaaScore = 17;
  // kaspa-pq: per-block DNS finality, populated only when the request carried a blockHash.
  bool blockFound = 18;
  bool blockIsDnsFinal = 19;
  bool blockIsConfirmedAnchor = 20;
  uint64 blockDaaScore = 21;
  // MISAKA VLT: where this node sits on the two-fence activation path, and the gauges behind it.
  // vltState is the stable label: pre_shadow | shadow | fence_reached_no_snapshot | active |
  // recovery. The alert worth writing is `vltWeightFenceReached && !vltFinalityActive` — the hard
  // fork happened and nothing is being finalized. Weights are decimal strings (W(E) is a
  // uRTE-scaled u128). vltGaugesDaaScore is the sink these were written at, so a scraper can tell
  // a steady state from a recompute that has stopped.
  string vltState = 22;
  bool vltShadowActive = 23;
  bool vltWeightFenceReached = 24;
  bool vltFinalityActive = 25;
  string vltTotalWeight = 26;
  string vltQuorumWeight = 27;
  uint64 vltSnapshotEpoch = 28;
  string vltSnapshotRoot = 29;
  uint64 vltGaugesDaaScore = 30;

  RPCError error = 1000;
}

// kaspa-pq Phase 11 (ADR-0010): the in-process validator service status.
// kaspa-pq EVM Lane v0.4 (§16): submit a raw EIP-2718 EVM transaction (hex) to
// the node's EVM mempool. Returns the Ethereum tx hash (keccak256 of the bytes).
message SubmitEvmTransactionRequestMessage {
  string transaction = 1;
}

message SubmitEvmTransactionResponseMessage {
  string transactionHash = 1;
  RPCError error = 1000;
}

// kaspa-pq EVM Lane v0.4 (§16): one EVM log entry.
message RpcEvmLogMessage {
  string address = 1;
  repeated string topics = 2;
  string data = 3;
}

// kaspa-pq EVM Lane v0.4 (§16): canonical-resolved EVM receipt.
message GetEvmTransactionReceiptRequestMessage {
  string transactionHash = 1;
}

message GetEvmTransactionReceiptResponseMessage {
  bool found = 1;
  string acceptingBlock = 2;
  uint64 evmNumber = 3;
  uint32 receiptIndex = 4;
  bool succeeded = 5;
  uint64 gasUsed = 6;
  uint64 cumulativeGasUsed = 7;
  repeated RpcEvmLogMessage logs = 8;
  RPCError error = 1000;
}

// kaspa-pq EVM Lane v0.4 (§16): DA-inclusion / acceptance / skip status.
message GetEvmTxInclusionStatusRequestMessage {
  string transactionHash = 1;
}

message GetEvmTxInclusionStatusResponseMessage {
  repeated string includedIn = 1;
  string acceptedIn = 2;
  uint32 receiptIndex = 3;
  uint32 lastSkipClass = 4;
  bool pending = 5;
  RPCError error = 1000;
}

// kaspa-pq EVM Lane v0.4 (§9.2): submit an EVM_DEPOSIT_LOCK outpoint to be
// claimed as a bridge deposit. The node resolves + validates it and queues a
// DepositClaim for its own template.
message SubmitEvmDepositClaimRequestMessage {
  string transactionId = 1;
  uint32 index = 2;
}

message SubmitEvmDepositClaimResponseMessage {
  string evmAddress = 1;
  uint64 amountSompi = 2;
  uint64 claimTipSompi = 3;
  RPCError error = 1000;
}

message GetValidatorStatusRequestMessage {}

message GetValidatorStatusResponseMessage {
  bool enabled = 1;
  string mode = 2;
  bool hasKey = 3;
  string validatorId = 4;
  string fundingAddress = 5;
  bool overlayConfigured = 6;
  uint64 epoch = 7;
  string bondStatus = 8;
  bool isActiveValidator = 9;
  bool hasSignedEpoch = 10;
  uint64 lastSignedEpoch = 11;
  uint32 status = 12;
  string statusLabel = 13;

  RPCError error = 1000;
}

