}

// PALW ConsensusV2 (ADR-0042 Decision 6): the derived facts a block producer reads before it may
// build an algo-6 attempt. u128 quantities travel as decimal strings; Hash64 identities as 128-hex.
// Derived, never the ingredients (ADR-0046) — a producer that multiplies its own would get an
// independent chance to disagree with admission.
message GetPalwProducerFactsRequestMessage {
  string classId = 1;
  string bondTransactionId = 2;
  uint32 bondIndex = 3;
  bool withBond = 4;
}

message GetPalwProducerFactsResponseMessage {
  // False on any network that is not ConsensusV2, and on one that does not know the class.
  bool available = 1;
  string chainPoint = 2;
  // The CANDIDATE's DAA score, not the tip's.
  uint64 daaScore = 3;
  string classId = 4;
  string artifactRoot = 5;
  string classTarget = 6;
  uint64 pwu = 7;
  bool isBaseClass = 8;
  uint64 minTraceRetentionDaa = 9;
  uint64 epochIndex = 10;
  uint64 epochBudgetBlocks = 11;
  uint64 epochProducedBlocks = 12;
  bool bondKnown = 13;
  string bondRegisteredPubkey = 14;
  string bondOperatorId = 15;
  uint64 bondCollateral = 16;
  string bondReservedExposure = 17;
  string bondExposureCeiling = 18;
  string bondClaimExposure = 19;
  // Empty when this bond may produce now; otherwise why it may not.
  string notReadyReason = 20;
  // Every PALW bond outpoint whose collateral may not be spent right now, "txid:index".
  // Answered on any ConsensusV2 network, including for a request that names no class — a wallet
  // needs this and has no class id to offer (audit3 H3).
  repeated string lockedBondOutpoints = 21;
  // ADR-0077 Decision 3: is this class seated on the FREE-PROMPT lane (ADR-0075
  // ClassLaneCertified, genesis set union chain set)? False whenever `available` is false.
  bool fpCertified = 22;
  // The free-prompt lane's price, from the network's own bundle: a quantum is
  // max(1, pwu_per_inference / fpQuantaPerCanonicalJob) leaves, and one claim earns at most
  // fpMaxQuantaPerReceipt of them. Zero on a network that prices no free-prompt lane.
  uint32 fpQuantaPerCanonicalJob = 23;
  uint32 fpMaxQuantaPerReceipt = 24;
  // ADR-0082 Decisions 10/11: is the free-prompt decode ruleset (`palw_fp_decode_rules`) in force
  // at daaScore? Past the fence a job carries (sampling_seed, temperature_q) inside its context
  // hash and decode leaves are what earn, so a builder must know before it builds. False whenever
  // `available` is false.
  bool fpDecodeRulesArmed = 25;
  // ADR-0084 Decision 5: the directory this node's PALW panel serves material from, so a
  // submitter on this host stages a claim's material and answer envelope where the panel reads.
  // Empty on a node running no panel.
  string palwRetentionDir = 26;
  RPCError error = 1000;
}

