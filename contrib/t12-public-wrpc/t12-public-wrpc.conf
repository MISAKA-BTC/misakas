# Installed on the two public hosts as /etc/nginx/snippets/t12-public-wrpc.conf
# and included from the TLS server (wallet.misakascan.com, llm.misakascan.com).
# The zone lives in /etc/nginx/conf.d/t12-wrpc-zone.conf:
#   limit_conn_zone $binary_remote_addr zone=t12wrpc:1m;
# gRPC (26312) and the EVM listener stay on 127.0.0.1.

location = /t12/wrpc/borsh {
    limit_conn t12wrpc 16;
    proxy_pass http://127.0.0.1:26313;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location = /t12/wrpc/json {
    limit_conn t12wrpc 16;
    proxy_pass http://127.0.0.1:26314;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
