[package]
name = "misaka-palw-tir-exec"
description = "RFC-0002 PALW-TIR v1, node side: a typed execution backend that compiles a TirProgramV1 into a plan over native integer storage and evaluates it byte-identically to the reference evaluator (misaka-palw-tir). Node software — never a consensus dependency"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tir-exec-bench"
path = "src/bin/tir-exec-bench.rs"

# The IR itself (a leaf crate) and a thread pool. Nothing of consensus: this crate is a fast
# implementation of the reference evaluator's function, and `kaspa-consensus-core` must never
# depend on it — the court runs the reference, a node runs this, and the tests hold them equal.
[dependencies]
misaka-palw-tir = { path = "../misaka-palw-tir" }
rayon.workspace = true
# Only for `tir-exec-bench --legacy`: the legacy A16 engine at the same geometry, the comparison
# the Phase F plan names (F9). Off by default so the backend builds without the consensus crates.
misaka-palw-base0 = { workspace = true, optional = true }
kaspa-consensus-core = { workspace = true, optional = true }

[features]
legacy-bench = ["dep:misaka-palw-base0", "dep:kaspa-consensus-core"]

[dev-dependencies]
# The golden vectors carry each primitive as its canonical Borsh encoding.
borsh.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true

[lints]
workspace = true
