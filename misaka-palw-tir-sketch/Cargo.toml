[package]
name = "misaka-palw-tir-sketch"
description = "RFC-0007 Part II prototype: seat-local algebraic verification of a PALW-TIR execution — every MatMul checked by Freivalds against a secret per-seat sketch of the weights (or a fresh vector), every other node recomputed exactly from the served witness, the committed rows compared last. Node software — never a consensus dependency"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tir-sketch-measure"
path = "src/bin/tir-sketch-measure.rs"
required-features = ["measure"]

# The IR (its reference evaluator is the exact half of the check) and the typed backend (the
# producer's capture and the refined range plan). Nothing of consensus: the check is seat-local,
# and the court it escalates to is the existing exact court, which this crate never touches.
[dependencies]
misaka-palw-tir = { path = "../misaka-palw-tir" }
misaka-palw-tir-exec = { path = "../misaka-palw-tir-exec" }
# The seat secret's derivations (keyed BLAKE2b) and the vector streams drawn from them (ChaCha20);
# both already in the workspace.
blake2b_simd.workspace = true
rand.workspace = true
rand_chacha.workspace = true
# `tir-sketch-measure` only: real Hugging Face configurations lowered WITHOUT weights, so the cost
# tables count the nodes and shapes of the programs a class would really register.
misaka-palw-tir-lower = { path = "../misaka-palw-tir-lower", optional = true }

[features]
measure = ["dep:misaka-palw-tir-lower"]

[lints]
workspace = true
