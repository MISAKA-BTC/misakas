  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # **The compiler is a pin, not a rumour.** `dtolnay/rust-toolchain`'s `toolchain` input
      # defaults to `stable` (see its own action.yml), so `uses: ...@<sha>  # stable` pinned the
      # ACTION and left the COMPILER floating: every job here used whatever `stable` was that
      # morning, while `Lints` alone pinned 1.93.0. The version is read out of
      # `rust-toolchain.toml` rather than repeated, because a second spelling of a version is a
      # second version. `scripts/ci-toolchain-pin-check.py` fails the build if any job stops
      # doing this.
      - name: Read the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then echo "rust-toolchain.toml has no channel"; exit 1; fi
          echo "RUST_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "pinned Rust toolchain: $channel"

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          components: rustfmt, clippy

      - name: Set up cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --tests --benches --examples -- -D warnings

      - name: Install cargo-deny (advisory gate)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2
        with:
          tool: cargo-deny

      - name: PQ-only secp256k1 isolation + advisory gate (ADR-0019 §14)
        # Hard-fails if secp256k1 re-enters the kaspa-consensus dependency tree
        # (`cargo tree -p kaspa-consensus -e normal`) and runs the dependency advisory
        # audit (cargo-deny, installed above). See scripts/pq-ci-guard.sh + deny.toml.
        run: bash scripts/pq-ci-guard.sh

  check-no-std:
    name: Check no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # **The compiler is a pin, not a rumour.** `dtolnay/rust-toolchain`'s `toolchain` input
      # defaults to `stable` (see its own action.yml), so `uses: ...@<sha>  # stable` pinned the
      # ACTION and left the COMPILER floating: every job here used whatever `stable` was that
      # morning, while `Lints` alone pinned 1.93.0. The version is read out of
      # `rust-toolchain.toml` rather than repeated, because a second spelling of a version is a
      # second version. `scripts/ci-toolchain-pin-check.py` fails the build if any job stops
      # doing this.
      - name: Read the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then echo "rust-toolchain.toml has no channel"; exit 1; fi
          echo "RUST_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "pinned Rust toolchain: $channel"

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          components: rustfmt, clippy

      - name: Add thumbv7em-none-eabi target
        run: rustup target add thumbv7em-none-eabi

      - name: Set up cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run no_std cargo check for crypto/addresses
        run: cargo check -p kaspa-addresses --no-default-features --target thumbv7em-none-eabi


