  build-release:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # **The compiler is a pin, not a rumour.** `dtolnay/rust-toolchain`'s `toolchain` input
      # defaults to `stable` (see its own action.yml), so `uses: ...@<sha>  # stable` pinned the
      # ACTION and left the COMPILER floating: every job here used whatever `stable` was that
      # morning, while `Lints` alone pinned 1.93.0. The version is read out of
      # `rust-toolchain.toml` rather than repeated, because a second spelling of a version is a
      # second version. `scripts/ci-toolchain-pin-check.py` fails the build if any job stops
      # doing this.
      - name: Read the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then echo "rust-toolchain.toml has no channel"; exit 1; fi
          echo "RUST_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "pinned Rust toolchain: $channel"

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          components: rustfmt, clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check musl toolchain tag consistency
        if: runner.os == 'Linux'
        run: bash musl-toolchain/check-tag.sh

      - name: Build RK with musl toolchain
        if: runner.os == 'Linux'
        env:
          # Fail closed (audit H-5): error out if neither an in-repo pin
          # (EXPECTED_XTOOLS_SHA256) nor a release sidecar is verifiable, instead
          # of warning and proceeding under the legacy preset_hash guard.
          MISAKA_REQUIRE_XTOOLS_SHA256: '1'
        run: |
          # Run build script for musl toolchain
          source musl-toolchain/build.sh
          # build.sh cd's into $GITHUB_WORKSPACE/musl-toolchain and does not cd back;
          # since it is sourced, that cwd persists here. Return to the workspace root so
          # the relative `test -x target/...` below resolves against the real target dir
          # (mirrors deploy.yaml). Without this, the misaka bin check fails even though
          # both cargo builds succeed.
          cd $GITHUB_WORKSPACE
          # Build bridge with allow-multiple-definition flag to handle mimalloc conflicts with libstdc++ in musl builds
          # This flag is only needed for kaspa-stratum-bridge due to its dual mimalloc dependency structure
          export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,--allow-multiple-definition"
          
          # Build other binaries first (without the allow-multiple-definition flag)
          cargo build --bin kaspad --bin rothschild --bin kaspa-wallet --bin stratum-bridge --release --target x86_64-unknown-linux-musl
          cargo build -p misaka-cli --bin misaka --release --target x86_64-unknown-linux-musl
          test -x target/x86_64-unknown-linux-musl/release/misaka
          
