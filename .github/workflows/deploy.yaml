name: Build and upload assets
on:
  release:
    types: [ published ]
  # **A dry run of the whole release, publishing nothing.** Every leg builds, smoke-starts its
  # kaspad and uploads its files as workflow artifacts; `sign` hashes, signs, attests and writes
  # the SBOM; `verify` then checks all of it the way a user would. Only a `release` event uploads
  # to a GitHub release. Run it on the commit you intend to tag, before tagging it.
  workflow_dispatch:

# Least privilege: read by default; the upload jobs below opt into contents: write.
permissions:
  contents: read

# The tag the files are named after. A dry run has no tag, so it names them after the run. The
# network, the identity the binaries must print and whether consensus is frozen are NOT spelled in
# this file: they are read from `release.json`, the one place a release declares them.
env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('dryrun-{0}', github.run_number) }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # the files go to a workflow artifact; only `sign` writes to the release
    strategy:
      fail-fast: false
      matrix:
        # Build gnu-linux on ubuntu-18.04 and musl on ubuntu latest
        # os: [ ubuntu-18.04, ubuntu-latest, windows-latest, macos-latest ]
        # ubuntu-latest: x86_64 Linux, static (musl). ubuntu-24.04-arm: ARM64 Linux, native glibc
        # build. macos-latest is Apple silicon (ARM64); windows-latest is x86_64.
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest ]
    name: Building, ${{ matrix.os }}
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # **The compiler is a pin, not a rumour.** `dtolnay/rust-toolchain`'s `toolchain` input
      # defaults to `stable` (see its own action.yml), so `uses: ...@<sha>  # stable` pinned the
      # ACTION and left the COMPILER floating: every job here used whatever `stable` was that
      # morning, while `Lints` alone pinned 1.93.0. The version is read out of
      # `rust-toolchain.toml` rather than repeated, because a second spelling of a version is a
      # second version. `scripts/ci-toolchain-pin-check.py` fails the build if any job stops
      # doing this.
      - name: Read the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then echo "rust-toolchain.toml has no channel"; exit 1; fi
          echo "RUST_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "pinned Rust toolchain: $channel"

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          components: rustfmt, clippy

      - name: Cache Cargo Build Outputs
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # runner.arch keeps the x86_64 and ARM64 Linux legs from restoring each other's target/.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}


      - name: Check musl toolchain tag consistency
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: bash musl-toolchain/check-tag.sh

      - name: Build on Linux
        if: runner.os == 'Linux' && runner.arch == 'X64'
        # We're using musl to make the binaries statically linked and portable
        env:
          # Fail closed (audit H-5): error out if neither an in-repo pin
          # (EXPECTED_XTOOLS_SHA256) nor a release sidecar is verifiable, instead
          # of warning and proceeding under the legacy preset_hash guard.
          MISAKA_REQUIRE_XTOOLS_SHA256: '1'
        run: |
          # Run build script for musl toolchain
          source musl-toolchain/build.sh
          
          # Go back to the workspace
          cd $GITHUB_WORKSPACE
          
          # Build non-bridge binaries first. Build `misaka` by package+bin so the
          # release cannot silently miss the unified operator CLI if workspace
          # defaults change.
          cargo --verbose build --bin kaspad --bin rothschild --bin kaspa-wallet --release --target x86_64-unknown-linux-musl
          cargo --verbose build -p kaspa-pq-miner -p kaspa-pq-validator -p kaspa-pq-signer --release --target x86_64-unknown-linux-musl
          cargo --verbose build -p misaka-cli --bin misaka --release --target x86_64-unknown-linux-musl
          test -x target/x86_64-unknown-linux-musl/release/misaka
          # Build bridge with allow-multiple-definition to resolve mimalloc/libstdc++ symbol collisions.
          # musl-toolchain/build.sh sets RUSTFLAGS directly, so we append this flag here explicitly.
          export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,--allow-multiple-definition"
          cargo --verbose build --bin stratum-bridge --release --target x86_64-unknown-linux-musl
          mkdir bin || true
          cp target/x86_64-unknown-linux-musl/release/kaspad bin/
          cp target/x86_64-unknown-linux-musl/release/rothschild bin/
          cp target/x86_64-unknown-linux-musl/release/kaspa-wallet bin/
          cp target/x86_64-unknown-linux-musl/release/kaspa-pq-miner bin/
          cp target/x86_64-unknown-linux-musl/release/kaspa-pq-validator bin/
          cp target/x86_64-unknown-linux-musl/release/kaspa-pq-signer bin/
          cp target/x86_64-unknown-linux-musl/release/misaka bin/
          cp target/x86_64-unknown-linux-musl/release/stratum-bridge bin/
          test -x bin/kaspa-pq-miner
          test -x bin/kaspa-pq-validator
          test -x bin/kaspa-pq-signer
          test -x bin/misaka
          archive="bin/rusty-kaspa-${{ env.RELEASE_TAG }}-linux-amd64.zip"
          zip -r "${archive}" ./bin/*
          echo "archive=${archive}" >> $GITHUB_ENV

      # **The release names what it built, with a digest per component** (ADR-0096 Decision 10,
      # `docs/components-manifest.md`). Only the components the Studio spawns are rows — today
      # `kaspad` and `misaka`; the family workers, the gateway and the rail the day this job
      # builds them — and the script refuses any other name rather than guess a kind. A row
      # points at the zip this job uploads and names its member, because the zip is what the
      # release publishes; a `url` at a loose `kaspad` would be a pointer at nothing.
      - name: Write the components manifest (Linux)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          platform=x86_64-unknown-linux-musl
          py=$(command -v python3 || command -v python)
          "$py" scripts/misaka-components-manifest.py \
            --release "${{ env.RELEASE_TAG }}" \
            --network "$("$py" -c 'import json, sys; sys.stdout.write(json.load(open("release.json"))["network"])')" \
            --platform "$platform" \
            --url-base "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}" \
            --archive "${{ env.archive }}" \
            --out "components-${platform}.json" \
            bin/kaspad bin/misaka
          echo "manifest=components-${platform}.json" >> $GITHUB_ENV
          echo "platform=${platform}" >> $GITHUB_ENV

      # ARM64 Linux is a native glibc build: the musl cross toolchain above targets x86_64 only.
      # The binaries need a glibc at least as new as the runner's (Ubuntu 24.04, glibc 2.39),
      # the same floor as testnet-12's x86_64 release build.
      - name: Install build dependencies (Linux ARM64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev zip

      - name: Build on Linux ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          cargo build --bin kaspad --bin rothschild --bin kaspa-wallet --release
          cargo build -p kaspa-pq-miner -p kaspa-pq-validator -p kaspa-pq-signer --release
          cargo build -p misaka-cli --bin misaka --release
          cargo build --bin stratum-bridge --release
          mkdir bin || true
          for b in kaspad rothschild kaspa-wallet kaspa-pq-miner kaspa-pq-validator kaspa-pq-signer misaka stratum-bridge; do
            cp "target/release/$b" bin/
            test -x "bin/$b"
          done
          archive="bin/rusty-kaspa-${{ env.RELEASE_TAG }}-linux-arm64.zip"
          zip -r "${archive}" ./bin/*
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Write the components manifest (Linux ARM64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          platform=$(rustc -vV | sed -n 's/^host: //p')
          py=python3
          "$py" scripts/misaka-components-manifest.py \
            --release "${{ env.RELEASE_TAG }}" \
            --network "$("$py" -c 'import json, sys; sys.stdout.write(json.load(open("release.json"))["network"])')" \
            --platform "$platform" \
            --url-base "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}" \
            --archive "${{ env.archive }}" \
            --out "components-${platform}.json" \
            bin/kaspad bin/misaka
          echo "manifest=components-${platform}.json" >> $GITHUB_ENV
          echo "platform=${platform}" >> $GITHUB_ENV

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --bin kaspad --release
          cargo build --bin rothschild --release
          cargo build --bin kaspa-wallet --release
          cargo build -p kaspa-pq-miner --release
          cargo build -p kaspa-pq-validator --release
          cargo build -p kaspa-pq-signer --release
          cargo build -p misaka-cli --bin misaka --release
          test -f target/release/misaka.exe
          cargo build --bin stratum-bridge --release
          mkdir bin || true
          cp target/release/kaspad.exe bin/
          cp target/release/rothschild.exe bin/
          cp target/release/kaspa-wallet.exe bin/
          cp target/release/kaspa-pq-miner.exe bin/
          cp target/release/kaspa-pq-validator.exe bin/
          cp target/release/kaspa-pq-signer.exe bin/
          cp target/release/misaka.exe bin/
          cp target/release/stratum-bridge.exe bin/
          test -f bin/kaspa-pq-miner.exe
          test -f bin/kaspa-pq-validator.exe
          test -f bin/kaspa-pq-signer.exe
          test -f bin/misaka.exe
          archive="bin/rusty-kaspa-${{ env.RELEASE_TAG }}-win64.zip"
          powershell "Compress-Archive bin/* \"${archive}\""
          echo "archive=${archive}" >> $GITHUB_ENV

      # The platform is read from the compiler that built the binaries (`rustc -vV`'s host), not
      # spelled by hand from the runner label: the Windows and macOS builds above pass no
      # `--target`, so the host triple IS the target. `kaspad.exe` is the row `kaspad`.
      - name: Write the components manifest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          platform=$(rustc -vV | sed -n 's/^host: //p')
          py=$(command -v python3 || command -v python)
          "$py" scripts/misaka-components-manifest.py \
            --release "${{ env.RELEASE_TAG }}" \
            --network "$("$py" -c 'import json, sys; sys.stdout.write(json.load(open("release.json"))["network"])')" \
            --platform "$platform" \
            --url-base "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}" \
            --archive "${{ env.archive }}" \
            --out "components-${platform}.json" \
            bin/kaspad.exe bin/misaka.exe
          echo "manifest=components-${platform}.json" >> $GITHUB_ENV
          echo "platform=${platform}" >> $GITHUB_ENV

      - name: Build on MacOS
        if: runner.os == 'macOS'
        run: |
          cargo build --bin kaspad --release
          cargo build --bin rothschild --release
          cargo build --bin kaspa-wallet --release
          cargo build -p kaspa-pq-miner --release
          cargo build -p kaspa-pq-validator --release
          cargo build -p kaspa-pq-signer --release
          cargo build -p misaka-cli --bin misaka --release
          test -x target/release/misaka
          cargo build --bin stratum-bridge --release
          mkdir bin || true
          cp target/release/kaspad bin/
          cp target/release/rothschild bin/
          cp target/release/kaspa-wallet bin/
          cp target/release/kaspa-pq-miner bin/
          cp target/release/kaspa-pq-validator bin/
          cp target/release/kaspa-pq-signer bin/
          cp target/release/misaka bin/
          cp target/release/stratum-bridge bin/
          test -x bin/kaspa-pq-miner
          test -x bin/kaspa-pq-validator
          test -x bin/kaspa-pq-signer
          test -x bin/misaka
          archive="bin/rusty-kaspa-${{ env.RELEASE_TAG }}-osx.zip"
          zip -r "${archive}" ./bin/*
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Write the components manifest (macOS)
        if: runner.os == 'macOS'
        run: |
          platform=$(rustc -vV | sed -n 's/^host: //p')
          py=$(command -v python3 || command -v python)
          "$py" scripts/misaka-components-manifest.py \
            --release "${{ env.RELEASE_TAG }}" \
            --network "$("$py" -c 'import json, sys; sys.stdout.write(json.load(open("release.json"))["network"])')" \
            --platform "$platform" \
            --url-base "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}" \
            --archive "${{ env.archive }}" \
            --out "components-${platform}.json" \
            bin/kaspad bin/misaka
          echo "manifest=components-${platform}.json" >> $GITHUB_ENV
          echo "platform=${platform}" >> $GITHUB_ENV

      # **Every platform's binary is started once before it ships.** The node runs on the network
      # `release.json` names, in a throwaway app directory with DNS seeding off, until it
      # prints its consensus params fingerprint and fence schedule; both must match the file.
      # A binary that does not start, or that starts on a different ruleset, fails its leg, and
      # `sign` then refuses the whole release.
      - name: Smoke-start kaspad and read its identity
        shell: bash
        run: |
          k=bin/kaspad
          [ -f bin/kaspad.exe ] && k=bin/kaspad.exe
          py=$(command -v python3 || command -v python)
          "$py" scripts/misaka-release-smoke.py --kaspad "$k" --release-json release.json \
            --platform "${{ env.platform }}" --out "release-identity-${{ env.platform }}.json"

      - name: Keep the files for the sign job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.platform }}
          if-no-files-found: error
          path: |
            ${{ env.archive }}
            ${{ env.manifest }}
            release-identity-${{ env.platform }}.json

  build-wasm:
    runs-on: ubuntu-latest
    name: Building WASM32 SDK
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # **The compiler is a pin, not a rumour.** `dtolnay/rust-toolchain`'s `toolchain` input
      # defaults to `stable` (see its own action.yml), so `uses: ...@<sha>  # stable` pinned the
      # ACTION and left the COMPILER floating: every job here used whatever `stable` was that
      # morning, while `Lints` alone pinned 1.93.0. The version is read out of
      # `rust-toolchain.toml` rather than repeated, because a second spelling of a version is a
      # second version. `scripts/ci-toolchain-pin-check.py` fails the build if any job stops
      # doing this.
      - name: Read the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then echo "rust-toolchain.toml has no channel"; exit 1; fi
          echo "RUST_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "pinned Rust toolchain: $channel"

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          components: rustfmt, clippy

      - name: Install llvm
        id: install_llvm
        continue-on-error: true
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-get install -y clang-15 lldb-15 lld-15 clangd-15 clang-tidy-15 clang-format-15 clang-tools-15 llvm-15-dev lld-15 lldb-15 llvm-15-tools libomp-15-dev libc++-15-dev libc++abi-15-dev libclang-common-15-dev libclang-15-dev libclang-cpp15-dev libunwind-15-dev
          # Make Clang 15 default
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-15/bin/clang++ 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-15/bin/clang 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/lib/llvm-15/bin/clang-format 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/lib/llvm-15/bin/clang-tidy 100
          sudo update-alternatives --install /usr/bin/run-clang-tidy run-clang-tidy /usr/lib/llvm-15/bin/run-clang-tidy 100
          # Alias cc to clang
          sudo update-alternatives --install /usr/bin/cc cc /usr/lib/llvm-15/bin/clang 0
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/lib/llvm-15/bin/clang++ 0

      - name: Install gcc-multilib
        # gcc-multilib allows clang to find gnu libraries properly
        run: |
          sudo apt-get update
          sudo apt install -y gcc-multilib

      - name: Install the pinned toolchain
        if: steps.install_llvm.outcome == 'success' && steps.install_llvm.conclusion == 'success'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          components: rustfmt, clippy

      - name: Install wasm-pack
        # --locked: build wasm-pack from its committed Cargo.lock for a reproducible toolchain.
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install NodeJS dependencies
        run: npm install --global typedoc@0.28.19 typescript@6.0.3

      - name: Cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM32 SDK
        run: |
          cd wasm
          bash build-release
          cd release
          zip -q -r kaspa-wasm32-sdk-${{ env.RELEASE_TAG }}.zip kaspa-wasm32-sdk
          archive="wasm/release/kaspa-wasm32-sdk-${{ env.RELEASE_TAG }}.zip"
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Keep the files for the sign job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wasm32-sdk
          if-no-files-found: error
          path: ${{ env.archive }}

  # **A release is only as trustworthy as the way a stranger can check it.** Once every platform
  # and the WASM SDK are built and smoke-started, this job writes RELEASE-INFO.json (the identity
  # every platform's kaspad printed, which must be the same on all of them, beside what
  # release.json declares), an SPDX SBOM of the source tree, and one SHA256SUMS over every
  # file; signs SHA256SUMS keylessly with Sigstore (the signing identity is this workflow at this
  # ref, recorded in the public Rekor log); and attests build provenance for every file. It needs
  # every leg: a release missing a platform is never signed as if it were whole. Only on a
  # `release` event does anything reach the GitHub release, and then all of it at once.
  sign:
    name: Release info, checksums, signature and SBOM
    needs: [ build, build-wasm ]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # upload the signed set to the release (release events only)
      id-token: write     # Sigstore keyless signing and provenance, with the workflow's OIDC identity
      attestations: write # GitHub build-provenance attestations
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Collect every leg's files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # upload-artifact keeps each leg's relative paths (the archives sit under bin/, the SDK
      # under wasm/release/); a release is a flat list of files, so flatten before hashing.
      - name: Flatten the collected files
        run: |
          mkdir flat
          find dist -type f -exec mv -n {} flat/ \;
          if [ -n "$(find dist -type f)" ]; then echo "two legs produced the same file name"; exit 1; fi
          rm -rf dist && mv flat dist
          ls -l dist

      - name: Write RELEASE-INFO.json from what the binaries printed
        run: |
          mkdir identities
          mv dist/release-identity-*.json identities/
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          python3 scripts/misaka-release-info.py --release-json release.json \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --rust "rustc $channel" \
            --out dist/RELEASE-INFO.json --summary "$GITHUB_STEP_SUMMARY" identities/*.json

      - name: Write the SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/misakas-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS (Sigstore, keyless)
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          mv SHA256SUMS SHA256SUMS.sigstore.json dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Keep the signed set for the verify job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          if-no-files-found: error
          path: dist/*

      - name: Publish to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*

  # **Check the release the way a user will, from a clean runner.** On a release event the files
  # come from the GitHub release itself; on a dry run, from the signed artifact. Any check that
  # fails fails the run.
  verify:
    name: Verify as a user would
    needs: [ sign ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download the release
        if: github.event_name == 'release'
        run: |
          mkdir dl
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dl

      - name: Download the dry run's signed set
        if: github.event_name != 'release'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: dl

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `sha256sum --check` without --ignore-missing fails on any listed file that was not
      # downloaded, so a release missing a file cannot pass.
      - name: Verify the signature, the checksums and the provenance
        working-directory: dl
        run: |
          ls -l
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}"
          sha256sum --check --strict SHA256SUMS
          while read -r _ f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done < SHA256SUMS
          {
            echo "## Release verified as a user would"
            echo
            echo "- Sigstore signature on \`SHA256SUMS\`: OK (identity \`https://github.com/${{ github.workflow_ref }}\`)"
            echo "- \`sha256sum --check\`: OK, $(wc -l < SHA256SUMS) files"
            echo "- \`gh attestation verify\`: OK for every file"
          } >> "$GITHUB_STEP_SUMMARY"
