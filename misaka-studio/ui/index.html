<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MISAKA Studio</title>
    <script>
      // Applied before the first paint. Reading the theme in React instead means a white flash on
      // every start for anyone using the dark theme — small, and the first thing they see.
      try {
        const stored = localStorage.getItem('misaka-studio.theme')
        const dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
