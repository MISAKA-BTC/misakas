[package]
name = "kaspa-pq-validator"
description = "PALW key/funding and historical stake-bond exit utility; DNS validator voting is retired"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kaspa-pq-validator"
path = "src/main.rs"

[dependencies]
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
kaspa-core.workspace = true
misaka-endpoints.workspace = true
kaspa-pq-validator-core.workspace = true
kaspa-rpc-core.workspace = true
kaspa-wrpc-client.workspace = true

faster-hex.workspace = true
log.workspace = true
rand.workspace = true

clap = { workspace = true, features = ["env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }

[lints]
workspace = true
