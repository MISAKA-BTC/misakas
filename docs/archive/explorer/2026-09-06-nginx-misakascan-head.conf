server {
    server_name misakascan.com www.misakascan.com;
    root /var/www/misaka-explorer;
    index index.html;

    # nginx.conf ships `gzip on` with gzip_types COMMENTED OUT, so only text/html was ever
    # compressed: app.js went over the wire as 212 KB and llm-jobs.json as 214 KB, uncompressed,
    # on every single load. Scoped here rather than edited into nginx.conf so the other sites on
    # this host are untouched.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    # `no-store` on these three cost a full re-download of the whole page weight on every visit.
    # A SHORT max-age with revalidation instead of `immutable`, deliberately: app.js contains a
    # self-update watcher (`checkVersion`) whose comment says it works "with the no-store cache
    # policy" — it HEADs /app.js every 60s and reloads when the ETag moves. `immutable` would have
    # made a reload keep serving the cached app.js for a year whenever a deploy forgot to bump
    # `?v=` in index.html, turning a hand-maintained rule into a silent year-long staleness bug.
    # At 300s the browser skips the body while a reader clicks around, revalidates after that
    # (nginx answers 304, no payload), and a deploy always lands within five minutes on its own.
    # Exact `=` matches: they cannot shadow the proxy locations above.
    location = /app.js      { add_header Cache-Control "public, max-age=300, must-revalidate" always; }
    location = /style.css   { add_header Cache-Control "public, max-age=300, must-revalidate" always; }
    location = /sha3.min.js { add_header Cache-Control "public, max-age=300, must-revalidate" always; }
    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location /transactions/ {
        proxy_pass http://127.0.0.1:8011;   # phase 1: REST still on the old host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }
